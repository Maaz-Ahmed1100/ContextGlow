[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextglow"
version = "0.1.0"
description = "Visualizing RAG Attention in Real-Time"
readme = "README.md"
authors = [{name = "ContextGlow Team"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "inseq>=0.5.0",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/Maaz-Ahmed1100/ContextGlow"

[tool.hatch.build.targets.wheel]
packages = ["contextglow"]
exclude = [
    ".env",
    "__pycache__",
    "tests",
    "*test*.py"
]
